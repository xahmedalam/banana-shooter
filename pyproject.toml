[project]
name = "banana-shooter"
version = "0.1.0"
description = "It's a 2d game where you are a monkey and your target is to kill the bats and doge."
readme = "README.md"
authors = [
    { name = "Ahmed Alam", email = "ahmed@conutil.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.8",
    "ruff>=0.17.3",
]

[project.scripts]
banana-shooter = "banana_shooter:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
